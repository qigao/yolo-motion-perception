[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-state-machine-game"
version = "0.1.0"
description = "Deterministic neural dynamical state machine game experiment"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "qigao"}]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8,<0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

