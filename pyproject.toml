[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-motion-perception"
version = "0.1.0"
description = "Pure-Python temporal motion perception from YOLO object tracks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "qigao"}]
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
vision = [
  "ultralytics>=8.3",
  "opencv-python>=4.9",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
yolo-motion = "yolo_motion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
