name: Phase C4-A Measurement

on:
  push:
    branches:
      - experiment/phase-c4-delay-marginalized-credit
    paths:
      - .github/workflows/phase-c4a-measurement.yml

permissions:
  contents: read

jobs:
  sealed-c4a-measurement:
    if: github.event.head_commit.message == 'measure: run sealed C4-A operator probe'
    runs-on: ubuntu-24.04
    env:
      C4_SCIENCE_HEAD: 8ae3154950ed53c4d0a0f555463042ff72674d31
      C4_PROSPECTIVE_MANIFEST_SHA256: a990745cf6f0e8c5fd7ae5d9a7189737b30a40168a4db3df1a6d3043d6d5876a
    steps:
      - name: Checkout frozen C4 science head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.C4_SCIENCE_HEAD }}
          fetch-depth: 1

      - name: Setup exact Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          check-latest: false
          cache: pip
          cache-dependency-path: requirements/phase-c4-python312.lock

      - name: Verify frozen science head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$C4_SCIENCE_HEAD"

      - name: Recreate locked C4 environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/phase-c4a-venv /tmp/phase-c4a-prospective /tmp/phase-c4a-result
          python -m venv /tmp/phase-c4a-venv
          /tmp/phase-c4a-venv/bin/python -m pip install --upgrade pip==26.2.1
          /tmp/phase-c4a-venv/bin/python -m pip install -r requirements/phase-c4-python312.lock
          grep -v '^#' requirements/phase-c4-python312.lock | sed '/^$/d' | sort -f > /tmp/phase-c4a-expected.lock
          /tmp/phase-c4a-venv/bin/python -m pip freeze --all | sort -f > /tmp/phase-c4a-actual.lock
          diff -u /tmp/phase-c4a-expected.lock /tmp/phase-c4a-actual.lock
          /tmp/phase-c4a-venv/bin/python -m pip install --no-deps --no-build-isolation -e .
          /tmp/phase-c4a-venv/bin/python -m pytest -q tests/test_phase_c4_*.py
          /tmp/phase-c4a-venv/bin/python -m ruff check \
            src/neural_state_machine/phase_c4_*.py \
            scripts/benchmark_phase_c4_delay_marginalized_credit.py \
            scripts/verify_phase_c4_delay_marginalized_credit.py \
            tests/test_phase_c4_*.py
          /tmp/phase-c4a-venv/bin/python scripts/benchmark_phase_c4_delay_marginalized_credit.py protocol

      - name: Recreate and verify sealed prospective manifest
        shell: bash
        run: |
          set -euo pipefail
          /tmp/phase-c4a-venv/bin/python scripts/benchmark_phase_c4_delay_marginalized_credit.py prepare-c4a \
            --output /tmp/phase-c4a-prospective
          ACTUAL_MANIFEST_SHA256="$(sha256sum /tmp/phase-c4a-prospective/c4a-manifest.json | awk '{print $1}')"
          test "$ACTUAL_MANIFEST_SHA256" = "$C4_PROSPECTIVE_MANIFEST_SHA256"
          test ! -e /tmp/phase-c4a-prospective/c4a-result.json
          /tmp/phase-c4a-venv/bin/python scripts/verify_phase_c4_delay_marginalized_credit.py \
            --stage c4a \
            --root /tmp/phase-c4a-prospective \
            --no-result-ok

      - name: Run registered C4-A operator measurement
        shell: bash
        run: |
          set -euo pipefail
          /tmp/phase-c4a-venv/bin/python scripts/benchmark_phase_c4_delay_marginalized_credit.py measure-c4a \
            --manifest /tmp/phase-c4a-prospective/c4a-manifest.json \
            --output /tmp/phase-c4a-result

      - name: Strictly verify sealed C4-A result
        shell: bash
        run: |
          set -euo pipefail
          /tmp/phase-c4a-venv/bin/python scripts/verify_phase_c4_delay_marginalized_credit.py \
            --stage c4a \
            --root /tmp/phase-c4a-result
          test -f /tmp/phase-c4a-result/c4a-manifest.json
          test -f /tmp/phase-c4a-result/c4a-result.json
          test -f /tmp/phase-c4a-result/c4a-provenance.json
          test ! -e /tmp/phase-c4a-result/c4b-result.json
          sha256sum /tmp/phase-c4a-result/c4a-manifest.json
          sha256sum /tmp/phase-c4a-result/c4a-result.json
          sha256sum /tmp/phase-c4a-result/c4a-provenance.json
          cat /tmp/phase-c4a-result/c4a-result.json

      - name: Upload sealed C4-A measurement bundle
        uses: actions/upload-artifact@v4
        with:
          name: phase-c4a-measurement-${{ env.C4_SCIENCE_HEAD }}
          path: /tmp/phase-c4a-result/
          if-no-files-found: error
          retention-days: 90
