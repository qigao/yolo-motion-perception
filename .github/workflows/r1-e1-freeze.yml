name: Freeze R1 E1 Registered Evidence

on:
  push:
    branches:
      - research/r1-e1-reservoir-architecture
    paths:
      - .github/workflows/r1-e1-freeze.yml

permissions:
  contents: write
  actions: read

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SCIENTIFIC_HEAD: 5371b80638ff429ad37e73fedb8c9357c34d5f87
      MEASUREMENT_RUN_ID: "35182685692"
      MEASUREMENT_ARTIFACT: r1-e1-registered-measurement-5371b80638ff429ad37e73fedb8c9357c34d5f87
      MANIFEST_SHA256: 148451614e84ba4da1dbd43e0f3894bd06288a6a12bf309b4dc56872feb2efed
      RESULT_SHA256: b7ff7d8ebff53433fc0611d1d6697a9368e07848c51403fc1273713c98e5e261
      EVIDENCE_ROOT: /tmp/r1-e1-registered
      TARGET: docs/experiments/r1-e1-reservoir-architecture
    steps:
      - name: Checkout freeze branch
        uses: actions/checkout@v4
        with:
          ref: research/r1-e1-reservoir-architecture
          fetch-depth: 0

      - name: Download the single registered measurement artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.MEASUREMENT_ARTIFACT }}
          path: ${{ env.EVIDENCE_ROOT }}
          github-token: ${{ github.token }}
          run-id: ${{ env.MEASUREMENT_RUN_ID }}

      - name: Verify frozen registered evidence before commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\n' < "${EVIDENCE_ROOT}/manifest.sha256")" = "${MANIFEST_SHA256}"
          test "$(tr -d '\n' < "${EVIDENCE_ROOT}/result.sha256")" = "${RESULT_SHA256}"
          python scripts/benchmark_r1_e1_reservoir.py verify --root "${EVIDENCE_ROOT}"

      - name: Freeze evidence and approved interpretation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${TARGET}"
          for f in manifest.json manifest.sha256 prospective-provenance.json prospective-provenance.sha256 provenance.json provenance.sha256 result.json result.sha256 trace-index.json trace-index.sha256; do
            cp "${EVIDENCE_ROOT}/${f}" "${TARGET}/${f}"
          done
          printf '%s' '' | base64 -d > "${TARGET}/report.md"
          git rm .github/workflows/r1-e1-registered-measurement.yml
          git rm .github/workflows/r1-e1-freeze.yml

      - name: Verify staged freeze is exactly scoped
        shell: bash
        run: |
          set -euo pipefail
          git add "${TARGET}"
          git diff --cached --name-only | sort > /tmp/actual.txt
          printf '%s\n' \
            '.github/workflows/r1-e1-freeze.yml' \
            '.github/workflows/r1-e1-registered-measurement.yml' \
            'docs/experiments/r1-e1-reservoir-architecture/manifest.json' \
            'docs/experiments/r1-e1-reservoir-architecture/manifest.sha256' \
            'docs/experiments/r1-e1-reservoir-architecture/prospective-provenance.json' \
            'docs/experiments/r1-e1-reservoir-architecture/prospective-provenance.sha256' \
            'docs/experiments/r1-e1-reservoir-architecture/provenance.json' \
            'docs/experiments/r1-e1-reservoir-architecture/provenance.sha256' \
            'docs/experiments/r1-e1-reservoir-architecture/report.md' \
            'docs/experiments/r1-e1-reservoir-architecture/result.json' \
            'docs/experiments/r1-e1-reservoir-architecture/result.sha256' \
            'docs/experiments/r1-e1-reservoir-architecture/trace-index.json' \
            'docs/experiments/r1-e1-reservoir-architecture/trace-index.sha256' > /tmp/expected.txt
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          test "$(sha256sum "${TARGET}/manifest.json" | awk '{print $1}')" = "${MANIFEST_SHA256}"
          test "$(sha256sum "${TARGET}/result.json" | awk '{print $1}')" = "${RESULT_SHA256}"

      - name: Commit no-refit evidence freeze
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: freeze R1 E1 registered evidence"
          git push origin HEAD:research/r1-e1-reservoir-architecture
