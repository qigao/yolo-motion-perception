docs/experiments/r1-e1-reservoir-architecture/trace-index.sha256
EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          test "$(sha256sum "${TARGET}/manifest.json" | awk '{print $1}')" = "${MANIFEST_SHA256}"
          test "$(sha256sum "${TARGET}/result.json" | awk '{print $1}')" = "${RESULT_SHA256}"

      - name: Commit no-refit evidence freeze
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: freeze R1 E1 registered evidence"
          git push origin HEAD:research/r1-e1-reservoir-architecture
