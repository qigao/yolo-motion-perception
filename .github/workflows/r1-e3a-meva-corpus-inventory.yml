name: R1-E3A MEVA candidate inventory

on:
  push:
    branches:
      - research/r1-e3a-meva-corpus
    paths:
      - tools/r1_e3a_meva_inventory.py
      - tools/r1_e3a_source_pool.py
      - tests/test_r1_e3a_source_pool.py
      - .github/workflows/r1-e3a-meva-corpus-inventory.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r1-e3a-meva-corpus-inventory
  cancel-in-progress: true

jobs:
  inventory:
    name: Public MEVA source-video inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout acquisition branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install acquisition-only dependencies
        run: python -m pip install --disable-pip-version-check boto3 pyyaml

      - name: Fetch only public MEVA activity annotations
        timeout-minutes: 10
        run: |
          archive="$RUNNER_TEMP/meva-annotations.tar.gz"
          unpack="$RUNNER_TEMP/meva-annotations"
          archive_url='https://gitlab.kitware.com/api/v4/projects/meva%2Fmeva-data-repo/repository/archive.tar.gz?path=annotation%2FDIVA-phase-2%2FMEVA&include_lfs_blobs=false'

          mkdir -p "$unpack"
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            "$archive_url" \
            --output "$archive"
          tar -xzf "$archive" -C "$unpack"

          kpf_root="$(find "$unpack" -type d -path '*/annotation/DIVA-phase-2/MEVA' -print -quit)"
          test -n "$kpf_root"
          test -d "$kpf_root"
          printf 'MEVA_KPF_ROOT=%s\n' "$kpf_root" >> "$GITHUB_ENV"

      - name: Enumerate pickup-containing public source videos
        run: |
          python tools/r1_e3a_meva_inventory.py \
            --kpf-root "$MEVA_KPF_ROOT" \
            --out-dir "$RUNNER_TEMP/r1-e3a-meva-inventory"

      - name: Build fail-closed source-pool ladder
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/r1-e3a-meva-inventory"
          inventory="$root/meva_candidate_inventory.json"
          inventory_sha="$(sha256sum "$inventory" | awk '{print $1}')"
          python tools/r1_e3a_source_pool.py \
            --inventory "$inventory" \
            --output "$root/r1_e3a_source_pool_plan.json" \
            --inventory-sha256 "$inventory_sha" \
            --inventory-workflow-run "$GITHUB_RUN_ID"

      - name: Print inventory and source-pool summaries
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "r1-e3a-meva-inventory"
          inventory = json.loads((root / "meva_candidate_inventory.json").read_text())
          plan = json.loads((root / "r1_e3a_source_pool_plan.json").read_text())
          print(json.dumps(inventory["summary"], indent=2, sort_keys=True))
          print(json.dumps(plan["inventory_structure"], indent=2, sort_keys=True))
          print((root / "inventory_files.sha256").read_text(), end="")
          print((root / "r1_e3a_source_pool_plan.json.sha256").read_text(), end="")
          PY

      - name: Upload candidate inventory and source-pool plan
        uses: actions/upload-artifact@v4
        with:
          name: r1-e3a-meva-candidate-inventory
          path: ${{ runner.temp }}/r1-e3a-meva-inventory/
          if-no-files-found: error
          retention-days: 30
