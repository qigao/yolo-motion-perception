name: R1-E3A MEVA candidate inventory

on:
  push:
    branches:
      - research/r1-e3a-meva-corpus
    paths:
      - tools/r1_e3a_meva_inventory.py
      - .github/workflows/r1-e3a-meva-corpus-inventory.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Public MEVA source-video inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout acquisition branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install acquisition-only dependencies
        run: python -m pip install --disable-pip-version-check boto3 pyyaml

      - name: Fetch only public MEVA activity annotations
        timeout-minutes: 10
        run: |
          repo="$RUNNER_TEMP/meva-data-repo"
          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            --no-checkout \
            https://gitlab.kitware.com/meva/meva-data-repo.git \
            "$repo"
          git -C "$repo" sparse-checkout set annotation/DIVA-phase-2/MEVA
          git -C "$repo" checkout HEAD

      - name: Enumerate pickup-containing public source videos
        run: |
          python tools/r1_e3a_meva_inventory.py \
            --kpf-root "$RUNNER_TEMP/meva-data-repo/annotation/DIVA-phase-2/MEVA" \
            --out-dir "$RUNNER_TEMP/r1-e3a-meva-inventory"

      - name: Print inventory summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "r1-e3a-meva-inventory"
          payload = json.loads((root / "meva_candidate_inventory.json").read_text())
          print(json.dumps(payload["summary"], indent=2, sort_keys=True))
          print((root / "inventory_files.sha256").read_text(), end="")
          PY

      - name: Upload candidate inventory
        uses: actions/upload-artifact@v4
        with:
          name: r1-e3a-meva-candidate-inventory
          path: ${{ runner.temp }}/r1-e3a-meva-inventory/
          if-no-files-found: error
          retention-days: 30
