name: ci

on:
  push:
  pull_request:

jobs:
  standalone:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Resolve Python 3.12 diagnostic environment
        run: |
          python -m venv /tmp/phase3c-lock
          /tmp/phase3c-lock/bin/python -m pip install --upgrade pip==26.2.1 setuptools wheel
          /tmp/phase3c-lock/bin/python -m pip install numpy==2.5.3 pytest==9.1.1 ruff==0.15.22
          /tmp/phase3c-lock/bin/python -m pip freeze
          /tmp/phase3c-lock/bin/python - <<'PY'
          import importlib.metadata as m
          import json
          print('LOCK_PROBE=' + json.dumps({n: m.version(n) for n in ('pip','setuptools','wheel','numpy','pytest','ruff','iniconfig','packaging','pluggy','pygments')}, sort_keys=True))
          PY
          exit 1
