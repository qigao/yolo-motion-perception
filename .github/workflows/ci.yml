name: ci

on:
  push:
  pull_request:

jobs:
  standalone:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Unit tests
        run: pytest -q

      - name: Ruff
        run: ruff check .

      - name: Deterministic benchmark
        run: python scripts/benchmark.py

      - name: Delayed-cue linear memory probe
        run: python scripts/benchmark_memory_probe.py

      - name: Verify frozen Phase 2B failure
        run: python scripts/verify_reward_learning_failure.py

      - name: Phase 2C learning diagnostics
        run: python scripts/benchmark_learning_diagnostics.py

      - name: Phase 3B delayed-credit tests
        run: pytest -q tests/test_delayed_credit.py tests/test_phase3b_delayed_benchmark.py tests/test_phase3b_learners.py tests/test_phase3b_controls.py tests/test_phase3b_evidence.py

      - name: Phase 3B Ruff
        run: ruff check src/neural_state_machine/delayed_credit.py src/neural_state_machine/phase3b_delayed_benchmark.py src/neural_state_machine/phase3b_learners.py src/neural_state_machine/phase3b_controls.py scripts/benchmark_phase3b_delayed_credit.py scripts/verify_phase3b_delayed_credit.py tests/test_delayed_credit.py tests/test_phase3b_delayed_benchmark.py tests/test_phase3b_learners.py tests/test_phase3b_controls.py tests/test_phase3b_evidence.py

      - name: Phase 3B overlapping protocol gate
        run: python scripts/benchmark_phase3b_delayed_credit.py --require-protocol-valid

      - name: Verify frozen Phase 3B delayed-credit evidence
        run: python scripts/verify_phase3b_delayed_credit.py

      - name: Phase 3C anonymous credit tests
        run: pytest -q tests/test_phase3c_formal_contract.py tests/test_phase3c_schedule.py tests/test_phase3c_learners.py tests/test_phase3c_controls.py tests/test_phase3c_benchmark.py

      - name: Phase 3C Ruff
        run: ruff check src/neural_state_machine/phase3c_formal_contract.py src/neural_state_machine/phase3c_schedule.py src/neural_state_machine/phase3c_learners.py src/neural_state_machine/phase3c_controls.py src/neural_state_machine/phase3c_benchmark.py scripts/benchmark_phase3c_anonymous_credit.py tests/test_phase3c_formal_contract.py tests/test_phase3c_schedule.py tests/test_phase3c_learners.py tests/test_phase3c_controls.py tests/test_phase3c_benchmark.py

      - name: Phase 3C formal and protocol gate
        run: python scripts/benchmark_phase3c_anonymous_credit.py --require-formal-valid --require-protocol-valid

      - name: Verify frozen Phase 3C anonymous-credit evidence
        run: python scripts/verify_phase3c_anonymous_credit.py
