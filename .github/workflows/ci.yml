name: ci

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core, dev, and optical dependencies
        run: python -m pip install -e '.[dev,optical]'
      - name: Unit tests
        run: pytest -q
      - name: Ruff
        run: ruff check .
      - name: Synthetic benchmark
        run: python scripts/benchmark_synthetic.py
      - name: Gait synthetic benchmark
        run: python scripts/benchmark_gait_synthetic.py
      - name: Scope scan
        run: |
          if grep -RniE 'flywire|(^|[^[:alnum:]_])snn([^[:alnum:]_]|$)|rclpy|sensor_msgs|geometry_msgs' src tests scripts configs pyproject.toml; then
            echo 'ERROR: forbidden cross-scope dependency marker found'
            exit 1
          fi
