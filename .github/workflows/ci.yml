name: ci

on:
  push:
  pull_request:

jobs:
  standalone:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Unit tests
        run: pytest -q
      - name: Ruff
        run: ruff check .
      - name: Deterministic benchmark
        run: python scripts/benchmark.py
      - name: Delayed-cue linear memory probe
        run: python scripts/benchmark_memory_probe.py

      - name: Verify frozen Phase 2B failure
        run: python scripts/verify_reward_learning_failure.py

      - name: Phase 2C learning diagnostics
        run: python scripts/benchmark_learning_diagnostics.py
