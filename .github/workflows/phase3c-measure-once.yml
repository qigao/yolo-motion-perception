name: Phase 3C registered measurement once

on:
  push:
    branches:
      - experiment/phase3c-anonymous-temporal-credit

jobs:
  measure-once:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact measured implementation
        uses: actions/checkout@v4
        with:
          ref: 4d13a55545e67aa97ce1e67fd40aaeef044b19a8

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Assert exact measured head and absent evidence
        run: |
          test "$(git rev-parse HEAD)" = "4d13a55545e67aa97ce1e67fd40aaeef044b19a8"
          test ! -e docs/experiments/phase-3c-anonymous-temporal-credit.json

      - name: Run first registered Phase 3C measurement exactly once
        run: |
          python scripts/benchmark_phase3c_anonymous_credit.py \
            --measure-registered \
            --evidence docs/experiments/phase-3c-anonymous-temporal-credit.json

      - name: Verify candidate evidence
        run: |
          python scripts/verify_phase3c_anonymous_credit.py \
            --evidence docs/experiments/phase-3c-anonymous-temporal-credit.json
          python scripts/benchmark_phase3c_anonymous_credit.py \
            --require-formal-valid --require-protocol-valid

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3c-registered-candidate
          path: docs/experiments/phase-3c-anonymous-temporal-credit.json
          if-no-files-found: ignore
