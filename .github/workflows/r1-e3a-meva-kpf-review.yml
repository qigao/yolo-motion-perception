name: R1-E3A MEVA KPF-guided pilot crops

on:
  push:
    branches:
      - research/r1-e3a-meva-corpus
    paths:
      - tools/r1_e3a_meva_kpf_review.py
      - .github/workflows/r1-e3a-meva-kpf-review.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r1-e3a-meva-kpf-review
  cancel-in-progress: true

jobs:
  review:
    name: Build KPF-guided no-model crops
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUCKET: mevadata-public-01
      SOURCE_KEY: drops-123-r13/2018-03-11/11/2018-03-11.11-20-00.11-25-00.school.G299.r13.avi
      SOURCE_SHA256: ed7b2a9b43755119f898d24588e28f42bedc3b004c9b740d65e6ed11587979ee
      BASE_URL: https://gitlab.kitware.com/meva/meva-data-repo/-/raw/master/annotation/DIVA-phase-2/MEVA/kitware/2018-03-11/11/2018-03-11.11-20-00.11-25-00.school.G299
      ACTIVITIES_SHA256: 6d3a3af8344bd1c299ceeff00760430a4b62ac5e4d8a090bf1be4fc336b9ce46

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install acquisition-only tools
        run: |
          python -m pip install --disable-pip-version-check boto3 pyyaml pillow
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Fetch exact source and KPF files
        run: |
          root="$RUNNER_TEMP/kpf-review"
          mkdir -p "$root"
          python - <<'PY'
          import os
          from pathlib import Path
          import boto3
          from botocore import UNSIGNED
          from botocore.config import Config
          root = Path(os.environ["RUNNER_TEMP"]) / "kpf-review"
          s3 = boto3.client("s3", region_name="us-east-1",
                            config=Config(signature_version=UNSIGNED))
          s3.download_file(os.environ["BUCKET"], os.environ["SOURCE_KEY"],
                           str(root / "source.avi"))
          PY
          printf '%s  %s\n' "$SOURCE_SHA256" "$root/source.avi" | sha256sum --check -
          curl --fail --location --retry 3 --retry-all-errors             "$BASE_URL.activities.yml" --output "$root/source.activities.yml"
          printf '%s  %s\n' "$ACTIVITIES_SHA256" "$root/source.activities.yml" | sha256sum --check -
          curl --fail --location --retry 3 --retry-all-errors             "$BASE_URL.geom.yml" --output "$root/source.geom.yml"
          sha256sum "$root/source.geom.yml" > "$root/source.geom.sha256"

      - name: Build deterministic KPF-guided crops
        run: |
          root="$RUNNER_TEMP/kpf-review"
          python tools/r1_e3a_meva_kpf_review.py             --video "$root/source.avi"             --activities "$root/source.activities.yml"             --geom "$root/source.geom.yml"             --out-dir "$root/output"             --expected-pickups 129             --sample-count 12
          cp "$root/source.geom.sha256" "$root/output/"
          rm -rf "$root/output/frames"
          sha256sum "$root/output/"* > "$root/output/artifact.sha256"

      - name: Upload review evidence
        uses: actions/upload-artifact@v4
        with:
          name: r1-e3a-meva-kpf-guided-review
          path: ${{ runner.temp }}/kpf-review/output/
          if-no-files-found: error
          retention-days: 14
