name: Phase C4-A Freeze

on:
  push:
    branches:
      - experiment/phase-c4-delay-marginalized-credit
    paths:
      - .github/workflows/phase-c4a-freeze.yml

permissions:
  actions: read
  contents: write

jobs:
  freeze-c4a-evidence:
    if: "${{ github.event.head_commit.message == 'freeze: persist sealed C4-A result' }}"
    runs-on: ubuntu-24.04
    env:
      C4_SCIENCE_HEAD: 8ae3154950ed53c4d0a0f555463042ff72674d31
      C4_MEASUREMENT_RUN: '35105578412'
      C4_MANIFEST_SHA256: a990745cf6f0e8c5fd7ae5d9a7189737b30a40168a4db3df1a6d3043d6d5876a
      C4_RESULT_SHA256: 7f398f474dba928d2a6aa993d0801563aa05af20faa8cd9a61ec94a6ca4697a4
      C4_PROVENANCE_SHA256: 8fb47b5e670754bc44c9ea70dd4cedce40e6f52165923142114577b4aec00351
      EVIDENCE_DIR: docs/experiments/phase-c4-delay-marginalized-credit
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          ref: experiment/phase-c4-delay-marginalized-credit
          fetch-depth: 1

      - name: Download sealed measurement artifact
        uses: actions/download-artifact@v4
        with:
          name: phase-c4a-measurement-${{ env.C4_SCIENCE_HEAD }}
          path: /tmp/phase-c4a-measurement
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.C4_MEASUREMENT_RUN }}

      - name: Verify artifact hashes and registered failure
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/phase-c4a-measurement
          test "$(sha256sum c4a-manifest.json | awk '{print $1}')" = "$C4_MANIFEST_SHA256"
          test "$(sha256sum c4a-result.json | awk '{print $1}')" = "$C4_RESULT_SHA256"
          test "$(sha256sum c4a-provenance.json | awk '{print $1}')" = "$C4_PROVENANCE_SHA256"
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('c4a-result.json').read_text(encoding='utf-8'))
          provenance = json.loads(Path('c4a-provenance.json').read_text(encoding='utf-8'))
          assert result['formal_valid'] is True
          assert result['protocol_valid'] is True
          assert result['operator_passed'] is False
          rows = {row['seed']: row for row in result['results']}
          assert set(rows) == {7, 17, 29}
          expected = {
              7: (200, 100, 147, True),
              17: (200, 100, 170, False),
              29: (200, 100, 160, False),
          }
          for seed, (post, reset, shuffled, passed) in expected.items():
              row = rows[seed]
              assert row['design_row_count'] == 2005
              assert row['post_training'] == {'correct': post, 'total': 200}
              assert row['state_reset'] == {'correct': reset, 'total': 200}
              assert row['shuffled_control'] == {'correct': shuffled, 'total': 200}
              assert row['operator_passed'] is passed
              assert [item['correct'] for item in row['per_delay']] == [40] * 5
              assert [item['correct'] for item in row['reset_per_delay']] == [20] * 5
              assert len(row['secondary_scores']) == 8
          assert provenance['stage'] == 'c4a'
          assert provenance['scientific_head'] == '8ae3154950ed53c4d0a0f555463042ff72674d31'
          assert provenance['execution_head'] == provenance['scientific_head']
          assert provenance['manifest_sha256'] == 'a990745cf6f0e8c5fd7ae5d9a7189737b30a40168a4db3df1a6d3043d6d5876a'
          assert provenance['result_sha256'] == '7f398f474dba928d2a6aa993d0801563aa05af20faa8cd9a61ec94a6ca4697a4'
          PY

      - name: Stage sealed C4-A evidence
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$EVIDENCE_DIR/c4a-manifest.json"
          test ! -e "$EVIDENCE_DIR/c4a-result.json"
          test ! -e "$EVIDENCE_DIR/c4a-provenance.json"
          test ! -e "$EVIDENCE_DIR/c4a-report.md"
          cp /tmp/phase-c4a-measurement/c4a-manifest.json "$EVIDENCE_DIR/c4a-manifest.json"
          cp /tmp/phase-c4a-measurement/c4a-result.json "$EVIDENCE_DIR/c4a-result.json"
          cp /tmp/phase-c4a-measurement/c4a-provenance.json "$EVIDENCE_DIR/c4a-provenance.json"
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('docs/experiments/phase-c4-delay-marginalized-credit')
          result = json.loads((root / 'c4a-result.json').read_text(encoding='utf-8'))
          rows = {row['seed']: row for row in result['results']}
          lines = [
              '# Phase C4-A Registered Result',
              '',
              '- Scientific head: `8ae3154950ed53c4d0a0f555463042ff72674d31`',
              '- Formal head: `8b2180ed24b6ff03db4b927ec29cdd9903b0ccac`',
              '- Measurement workflow run: `35105578412`',
              '- Manifest SHA-256: `a990745cf6f0e8c5fd7ae5d9a7189737b30a40168a4db3df1a6d3043d6d5876a`',
              '- Result SHA-256: `7f398f474dba928d2a6aa993d0801563aa05af20faa8cd9a61ec94a6ca4697a4`',
              '- Provenance SHA-256: `8fb47b5e670754bc44c9ea70dd4cedce40e6f52165923142114577b4aec00351`',
              '',
              '## Registered verdict',
              '',
              '- `formal_valid = true`',
              '- `protocol_valid = true`',
              '- `operator_passed = false`',
              '',
              '| Seed | Normal | Reset | Shuffled | Seed gate |',
              '| ---: | ---: | ---: | ---: | :--- |',
          ]
          for seed in (7, 17, 29):
              row = rows[seed]
              lines.append(
                  f"| {seed} | {row['post_training']['correct']}/200 | "
                  f"{row['state_reset']['correct']}/200 | "
                  f"{row['shuffled_control']['correct']}/200 | "
                  f"{'PASS' if row['operator_passed'] else 'FAIL'} |"
              )
          lines += [
              '',
              'All three normal evaluations are `200/200`, every normal per-delay cell is `40/40`, '
              'and every reset condition is exactly `100/200` with `20/40` in each delay cell. '
              'The registered failure is the shuffled negative control: seed 7 is `147/200` and passes '
              'the `<150` threshold, while seed 17 is `170/200` and seed 29 is `160/200`.',
              '',
              'Under the registered stop rule, C4-A therefore does **not** establish operator sufficiency. '
              'The failure is specifically lack of negative-control specificity rather than failure to recover '
              'the normal task. C4-B is not authorized and must not be run from this result.',
              '',
              'The eight secondary evaluation sets remain diagnostic only and were not used for fitting, '
              'selection, or gate decisions.',
              '',
          ]
          (root / 'c4a-report.md').write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Commit sealed evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$EVIDENCE_DIR/c4a-manifest.json" \
                  "$EVIDENCE_DIR/c4a-result.json" \
                  "$EVIDENCE_DIR/c4a-provenance.json" \
                  "$EVIDENCE_DIR/c4a-report.md"
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m 'docs: freeze registered C4-A failure result'
          git push origin HEAD:experiment/phase-c4-delay-marginalized-credit
