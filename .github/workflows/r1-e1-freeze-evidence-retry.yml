name: Retry Freeze R1 E1 Evidence

on:
  push:
    branches:
      - research/r1-e1-reservoir-architecture
    paths:
      - .github/workflows/r1-e1-freeze-evidence-retry.yml

permissions:
  contents: write
  actions: read

jobs:
  freeze:
    runs-on: ubuntu-24.04
    env:
      RUN_ID: "35182685692"
      ARTIFACT: r1-e1-registered-measurement-5371b80638ff429ad37e73fedb8c9357c34d5f87
      MANIFEST_SHA256: 148451614e84ba4da1dbd43e0f3894bd06288a6a12bf309b4dc56872feb2efed
      RESULT_SHA256: b7ff7d8ebff53433fc0611d1d6697a9368e07848c51403fc1273713c98e5e261
      ROOT: /tmp/r1-e1-evidence
      DEST: docs/experiments/r1-e1-reservoir-architecture
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/r1-e1-reservoir-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - run: |
          python -m pip install numpy==2.5.3
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ROOT }}
          github-token: ${{ github.token }}
          run-id: ${{ env.RUN_ID }}
      - name: Verify and freeze exact registered bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "${ROOT}/manifest.json" | cut -d' ' -f1)" = "${MANIFEST_SHA256}"
          test "$(sha256sum "${ROOT}/result.json" | cut -d' ' -f1)" = "${RESULT_SHA256}"
          python scripts/benchmark_r1_e1_reservoir.py verify --root "${ROOT}"
          mkdir -p "${DEST}"
          cp "${ROOT}"/* "${DEST}/"
          rm -f .github/workflows/r1-e1-freeze-evidence.yml
          rm -f .github/workflows/r1-e1-freeze-evidence-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: freeze R1 E1 registered evidence"
          git push origin HEAD:research/r1-e1-reservoir-architecture
