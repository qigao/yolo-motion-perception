name: R1 E1 Registered Measurement

on:
  push:
    branches:
      - research/r1-e1-reservoir-architecture
    paths:
      - .github/workflows/r1-e1-registered-measurement.yml

permissions:
  contents: read
  actions: read

jobs:
  registered-measurement:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SCIENTIFIC_HEAD: 5371b80638ff429ad37e73fedb8c9357c34d5f87
      PREFLIGHT_RUN_ID: "35182093605"
      PROSPECTIVE_ARTIFACT: r1-e1-prospective-manifest-5371b80638ff429ad37e73fedb8c9357c34d5f87
      MANIFEST_SHA256: 148451614e84ba4da1dbd43e0f3894bd06288a6a12bf309b4dc56872feb2efed
      EVIDENCE_ROOT: /tmp/r1-e1-evidence
    steps:
      - name: Checkout sealed scientific head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SCIENTIFIC_HEAD }}
          fetch-depth: 1

      - name: Set up sealed Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip

      - name: Install sealed runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install numpy==2.5.3
          python -m pip install --no-deps -e .
          python - <<'PY'
          import platform
          import numpy as np
          if platform.python_version() != "3.12.14":
              raise SystemExit(f"expected Python 3.12.14, got {platform.python_version()}")
          if np.__version__ != "2.5.3":
              raise SystemExit(f"expected NumPy 2.5.3, got {np.__version__}")
          PY

      - name: Download approved prospective manifest
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PROSPECTIVE_ARTIFACT }}
          path: ${{ env.EVIDENCE_ROOT }}
          github-token: ${{ github.token }}
          run-id: ${{ env.PREFLIGHT_RUN_ID }}

      - name: Verify sealed prospective evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\n' < "${EVIDENCE_ROOT}/manifest.sha256")" = "${MANIFEST_SHA256}"
          python scripts/benchmark_r1_e1_reservoir.py verify \
            --root "${EVIDENCE_ROOT}" \
            --no-result-ok

      - name: Run exactly one registered R1 E1 measurement
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark_r1_e1_reservoir.py measure \
            --root "${EVIDENCE_ROOT}" \
            --manifest-sha256 "${MANIFEST_SHA256}"

      - name: Verify registered evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark_r1_e1_reservoir.py verify \
            --root "${EVIDENCE_ROOT}"

      - name: Upload registered measurement evidence
        uses: actions/upload-artifact@v4
        with:
          name: r1-e1-registered-measurement-${{ env.SCIENTIFIC_HEAD }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 90
