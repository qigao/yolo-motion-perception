name: real-video-baseline

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/real-video-baseline.yml
      - benchmarks/sources/caviar.yaml
      - benchmarks/clips/caviar.yaml
      - configs/baseline.yaml
      - scripts/fetch_benchmark_sources.py
      - scripts/materialize_benchmark_clips.py
      - scripts/summarize_tracks.py
      - scripts/evaluate_caviar_coverage.py
      - src/yolo_motion/cli.py
      - src/yolo_motion/coverage.py
      - src/yolo_motion/source_probe.py
      - src/yolo_motion/track_summary.py

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install vision runtime
        run: python -m pip install -e '.[vision]'

      - name: Record environment
        run: |
          mkdir -p runs/caviar-baseline
          python --version > runs/caviar-baseline/environment.txt
          python -c "import ultralytics; print('ultralytics', ultralytics.__version__)" >> runs/caviar-baseline/environment.txt
          python -c "import cv2; print('opencv', cv2.__version__)" >> runs/caviar-baseline/environment.txt
          python -m pip freeze > runs/caviar-baseline/pip-freeze.txt

      - name: Download licensed CAVIAR sources
        run: |
          python scripts/fetch_benchmark_sources.py \
            --manifest benchmarks/sources/caviar.yaml \
            --output-dir runs/caviar-baseline/source-probe

      - name: Materialize selected clips
        run: |
          python scripts/materialize_benchmark_clips.py \
            --sources benchmarks/sources/caviar.yaml \
            --clips benchmarks/clips/caviar.yaml \
            --source-dir runs/caviar-baseline/source-probe/sources \
            --output-dir runs/caviar-baseline/clips
          sha256sum runs/caviar-baseline/clips/*.mp4 > runs/caviar-baseline/clip-sha256.txt

      - name: Run inference-size coverage ablation
        run: |
          set -euo pipefail
          while read -r imgsz label; do
            for scenario in stationary lateral_crossing approaching pose_change; do
              result_dir="runs/caviar-baseline/results/${label}/${scenario}"
              mkdir -p "${result_dir}"
              /usr/bin/time -f '%e' -o "${result_dir}/elapsed-seconds.txt" \
                python -m yolo_motion.cli \
                  --source "runs/caviar-baseline/clips/${scenario}.mp4" \
                  --model yolo11s.pt \
                  --tracker botsort.yaml \
                  --conf 0.10 \
                  --imgsz "${imgsz}" \
                  --config configs/baseline.yaml \
                  --observations-jsonl "${result_dir}/observations.jsonl" \
                  --jsonl "${result_dir}/motion.jsonl"
              python scripts/summarize_tracks.py \
                --predictions "${result_dir}/motion.jsonl" \
                > "${result_dir}/track-summary.txt"
            done
          done <<'EOF'
          640 yolo11s_imgsz640
          960 yolo11s_imgsz960
          1280 yolo11s_imgsz1280
          EOF

      - name: Evaluate CAVIAR GT coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          from yolo_motion.coverage import (
              evaluate_caviar_coverage,
              load_caviar_ground_truth,
              load_observations,
          )
          from yolo_motion.source_probe import load_clip_manifest, load_source_manifest

          root = Path("runs/caviar-baseline")
          sources = load_source_manifest("benchmarks/sources/caviar.yaml")
          clips = load_clip_manifest("benchmarks/clips/caviar.yaml")
          source_by_name = {source.name: source for source in sources.sources}
          labels = [
              "yolo11s_imgsz640",
              "yolo11s_imgsz960",
              "yolo11s_imgsz1280",
          ]
          summary = {}
          total_seconds = {}
          for label in labels:
              summary[label] = {}
              total_seconds[label] = 0.0
              for clip in clips.clips:
                  source = source_by_name[clip.source]
                  if not source.ground_truth_url:
                      raise RuntimeError(f"missing GT URL for {clip.source}")
                  gt_name = Path(urlparse(source.ground_truth_url).path).name
                  gt_path = root / "source-probe" / "ground-truth" / gt_name
                  result_dir = root / "results" / label / clip.name
                  observations_path = result_dir / "observations.jsonl"
                  elapsed = float((result_dir / "elapsed-seconds.txt").read_text().strip())
                  total_seconds[label] += elapsed
                  gt = load_caviar_ground_truth(
                      gt_path,
                      start_frame=clip.start_frame,
                      end_frame=clip.end_frame,
                      object_ids=set(clip.gt_object_ids),
                  )
                  report = evaluate_caviar_coverage(
                      gt,
                      load_observations(observations_path),
                      source_width=384,
                      source_height=288,
                      start_frame=clip.start_frame,
                      iou_threshold=0.3,
                  )
                  report["scenario"] = clip.name
                  report["gt_object_ids"] = list(clip.gt_object_ids)
                  report["start_frame"] = clip.start_frame
                  report["end_frame"] = clip.end_frame
                  report["elapsed_seconds"] = elapsed
                  out = result_dir / "coverage.json"
                  out.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
                  summary[label][clip.name] = report

          payload = {
              "coverage": summary,
              "total_elapsed_seconds": total_seconds,
          }
          (root / "coverage-summary.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n"
          )
          lines = [
              "# CAVIAR YOLO11s inference-size ablation",
              "",
              "| config | stationary | lateral crossing | approaching | pose change | mean | total s |",
              "| --- | ---: | ---: | ---: | ---: | ---: | ---: |",
          ]
          for label in labels:
              values = [
                  summary[label][scenario]["coverage"]
                  for scenario in [
                      "stationary",
                      "lateral_crossing",
                      "approaching",
                      "pose_change",
                  ]
              ]
              mean = sum(values) / len(values)
              lines.append(
                  f"| {label} | "
                  + " | ".join(f"{value:.1%}" for value in values)
                  + f" | {mean:.1%} | {total_seconds[label]:.1f} |"
              )
          (root / "coverage-summary.md").write_text("\n".join(lines) + "\n")
          print((root / "coverage-summary.md").read_text())
          PY

      - name: Capture model hash
        run: |
          if [ -f yolo11s.pt ]; then
            sha256sum yolo11s.pt > runs/caviar-baseline/model-sha256.txt
          fi

      - name: Upload baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: caviar-real-video-imgsz
          path: |
            runs/caviar-baseline/clips
            runs/caviar-baseline/results
            runs/caviar-baseline/source-probe/ground-truth
            runs/caviar-baseline/source-probe/metadata.json
            runs/caviar-baseline/source-probe/sha256.txt
            runs/caviar-baseline/coverage-summary.json
            runs/caviar-baseline/coverage-summary.md
            runs/caviar-baseline/clip-sha256.txt
            runs/caviar-baseline/environment.txt
            runs/caviar-baseline/pip-freeze.txt
            runs/caviar-baseline/model-sha256.txt
          if-no-files-found: error
          retention-days: 14
