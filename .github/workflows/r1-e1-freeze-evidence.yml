name: Freeze R1 E1 Registered Evidence

on:
  push:
    branches:
      - research/r1-e1-reservoir-architecture
    paths:
      - .github/workflows/r1-e1-freeze-evidence.yml

permissions:
  contents: write
  actions: read

jobs:
  freeze-evidence:
    runs-on: ubuntu-24.04
    env:
      SCIENTIFIC_HEAD: 5371b80638ff429ad37e73fedb8c9357c34d5f87
      MEASUREMENT_RUN_ID: "35182685692"
      MEASUREMENT_ARTIFACT: r1-e1-registered-measurement-5371b80638ff429ad37e73fedb8c9357c34d5f87
      MANIFEST_SHA256: 148451614e84ba4da1dbd43e0f3894bd06288a6a12bf309b4dc56872feb2efed
      RESULT_SHA256: b7ff7d8ebff53433fc0611d1d6697a9368e07848c51403fc1273713c98e5e261
      EVIDENCE_ROOT: /tmp/r1-e1-evidence
      DEST: docs/experiments/r1-e1-reservoir-architecture
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/r1-e1-reservoir-architecture
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Install verifier runtime
        run: |
          python -m pip install numpy==2.5.3
          python -m pip install --no-deps -e .

      - name: Download the single registered result
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.MEASUREMENT_ARTIFACT }}
          path: ${{ env.EVIDENCE_ROOT }}
          github-token: ${{ github.token }}
          run-id: ${{ env.MEASUREMENT_RUN_ID }}

      - name: Verify sealed evidence before freezing
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\n' < "${EVIDENCE_ROOT}/manifest.sha256")" = "${MANIFEST_SHA256}"
          test "$(tr -d '\n' < "${EVIDENCE_ROOT}/result.sha256")" = "${RESULT_SHA256}"
          test "$(sha256sum "${EVIDENCE_ROOT}/manifest.json" | cut -d' ' -f1)" = "${MANIFEST_SHA256}"
          test "$(sha256sum "${EVIDENCE_ROOT}/result.json" | cut -d' ' -f1)" = "${RESULT_SHA256}"
          python scripts/benchmark_r1_e1_reservoir.py verify --root "${EVIDENCE_ROOT}"

      - name: Freeze registered files and interpretation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${DEST}"
          cp "${EVIDENCE_ROOT}"/* "${DEST}/"
          cat > "${DEST}/report.md" <<'EOF'
          # R1 Phase E1 — Reservoir Architecture and Memory Capacity Report

          > Status: registered measurement completed once; interpretation frozen without refit.
          >
          > Scientific head: `5371b80638ff429ad37e73fedb8c9357c34d5f87`
          >
          > Manifest SHA-256: `148451614e84ba4da1dbd43e0f3894bd06288a6a12bf309b4dc56872feb2efed`
          >
          > Result SHA-256: `b7ff7d8ebff53433fc0611d1d6697a9368e07848c51403fc1273713c98e5e261`
          >
          > Registered workflow run: `35182685692`

          ## Validity

          The registered run used Python 3.12.14 and NumPy 2.5.3, checked out the sealed scientific head, consumed the approved prospective manifest, executed exactly one registered measurement, and passed the evidence verifier with `registered_arm_count=50` and `valid=true`.

          All five Phase 2A compatibility seeds passed. E1-A and E1-B reset controls passed exactly. The registered evidence bundle contains no retained per-state trace artifacts.

          ## Aggregate results

          Values below are arithmetic means across the five preregistered seeds. Horizon columns list the per-seed contiguous preregistered horizon values.

          | Budget | Architecture | E1-A memory macro | 85% memory horizon | E1-B history macro | 80% history horizon | E1-C corrupted macro |
          |---:|---|---:|---|---:|---|---:|
          | 64 | Shallow | 85.14% | 20,20,20,20,20 | 62.25% | 5,5,5,5,5 | 93.36% |
          | 64 | Grouped-2 | 84.64% | 20,10,20,10,20 | 62.78% | 5,5,5,5,5 | 93.38% |
          | 64 | Grouped-4 | 85.71% | 20,20,20,20,20 | 62.65% | 5,5,5,5,5 | 93.12% |
          | 64 | Deep-2 | 83.29% | 10,20,10,20,20 | 61.15% | 5,5,5,5,5 | 91.68% |
          | 64 | Deep-4 | 84.36% | 10,20,20,20,20 | 60.55% | 5,5,5,1,5 | 91.46% |
          | 256 | Shallow | 87.21% | 20,20,20,20,20 | 63.07% | 5,5,5,5,5 | 94.18% |
          | 256 | Grouped-2 | 87.86% | 20,20,20,20,20 | 62.62% | 5,5,5,5,5 | 94.88% |
          | 256 | Grouped-4 | 89.36% | 40,40,20,20,20 | 62.48% | 5,5,5,5,5 | 93.98% |
          | 256 | Deep-2 | 86.71% | 20,20,20,20,20 | 63.18% | 5,5,5,5,5 | 94.42% |
          | 256 | Deep-4 | 88.64% | 20,20,20,40,20 | 62.38% | 5,5,5,5,5 | 94.20% |

          ## Interpretation

          The frozen interpretation is **Outcome D as the primary category, with Outcome E as a secondary category**.

          The neuron budget and reservoir realization effects are more stable than a single architecture ordering across E1-A, E1-B, and E1-C. Increasing the budget from 64 to 256 generally extends binary cue memory and modestly improves corruption robustness, but no topology dominates all three registered measurements across seeds.

          E1-A shows that single-cue fading memory can be extended by capacity. Grouped-4 at N=256 shows the strongest registered indication at delay 40, with two of five seeds reaching the contiguous 85% horizon of 40; Deep-4 reaches 40 for one seed. This is not sufficiently seed-stable to establish topology superiority.

          E1-B is the strongest limiting result. Across nearly every architecture and budget, the contiguous 80% separability horizon remains 5; at longer horizons performance approaches the four-class chance floor. Increasing neuron budget therefore does not by itself solve long multi-event history separability under the registered dynamics.

          E1-C shows high synthetic corruption robustness across all arms. The N=256 arms are generally stronger than N=64, while architecture differences are comparatively small and do not define a stable cross-task ordering.

          Accordingly, E1 does not select a production architecture. It establishes that capacity scaling helps some forms of fading memory and robustness, while long multi-event history remains a separate representation bottleneck. R1 E2 may study reservoir dynamics only after this evidence is frozen; R2 remains independent and unchanged.

          ## No-refit declaration

          No result-driven hyperparameter tuning, threshold changes, architecture selection, extra seed, refit, or repeated registered measurement was performed after observing these results. This report is an interpretation of the single registered result bundle only.
          EOF
          sed -i 's/^          //' "${DEST}/report.md"

      - name: Remove one-shot workflows and commit frozen evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/r1-e1-registered-measurement.yml
          rm -f .github/workflows/r1-e1-freeze-evidence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${DEST}" .github/workflows/r1-e1-registered-measurement.yml .github/workflows/r1-e1-freeze-evidence.yml
          git commit -m "docs: freeze R1 E1 registered evidence"
          git push origin HEAD:research/r1-e1-reservoir-architecture
