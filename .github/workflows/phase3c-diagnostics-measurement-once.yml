name: phase3c-diagnostics-measurement-once

on:
  push:
    branches:
      - experiment/phase3c-anonymous-temporal-credit
    paths:
      - .github/workflows/phase3c-diagnostics-measurement-once.yml

permissions:
  contents: read
  actions: read

jobs:
  measurement:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout reviewed implementation
        uses: actions/checkout@v4
        with:
          ref: 3934360384483a50f3132badf709bec2e598d453
          path: runtime
          persist-credentials: false

      - name: Download sealed prospective manifest from exact CI run
        uses: actions/download-artifact@v4
        with:
          name: phase3c-prospective-manifest-3934360384483a50f3132badf709bec2e598d453
          path: manifest-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35070274511

      - name: Verify implementation and manifest identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C runtime rev-parse HEAD)" = "3934360384483a50f3132badf709bec2e598d453"
          test -f manifest-source/manifest.json
          test -f manifest-source/manifest.sha256
          test "$(sha256sum manifest-source/manifest.json | awk '{print $1}')" = "7e4df48a0d73fcdad7de9dc0c8e8a15e64f041388a5c6044dd9fa79b938ebc9b"
          test "$(tr -d '\r\n' < manifest-source/manifest.sha256)" = "7e4df48a0d73fcdad7de9dc0c8e8a15e64f041388a5c6044dd9fa79b938ebc9b"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: runtime/requirements/phase3c-diagnostics-python312.lock

      - name: Recreate reviewed Python 3.12 environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/phase3c-diagnostic-venv
          python -m venv /tmp/phase3c-diagnostic-venv
          /tmp/phase3c-diagnostic-venv/bin/python -m pip install --upgrade pip==26.2.1
          /tmp/phase3c-diagnostic-venv/bin/python -m pip install -r runtime/requirements/phase3c-diagnostics-python312.lock
          grep -v '^#' runtime/requirements/phase3c-diagnostics-python312.lock | sed '/^$/d' | sort -f > /tmp/phase3c-expected.lock
          /tmp/phase3c-diagnostic-venv/bin/python -m pip freeze --all | sort -f > /tmp/phase3c-actual.lock
          diff -u /tmp/phase3c-expected.lock /tmp/phase3c-actual.lock
          /tmp/phase3c-diagnostic-venv/bin/python -m pip install --no-deps --no-build-isolation -e ./runtime

      - name: Compare sealed and current environment fields
        working-directory: runtime
        shell: bash
        run: |
          set -euo pipefail
          /tmp/phase3c-diagnostic-venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          from neural_state_machine.phase3c_diagnostics.manifest import environment_snapshot

          expected = json.loads(Path('../manifest-source/manifest.json').read_text())['environment']
          current = environment_snapshot()
          differences = []
          for key in sorted(set(expected) | set(current)):
              if expected.get(key) != current.get(key):
                  differences.append(key)
                  print(f'ENV_DIFF {key}')
                  print('EXPECTED:', json.dumps(expected.get(key), sort_keys=True))
                  print('CURRENT :', json.dumps(current.get(key), sort_keys=True))
          print('ENV_DIFF_KEYS:', json.dumps(differences))
          PY

      - name: Execute approved registered measurement
        working-directory: runtime
        shell: bash
        run: |
          set -euo pipefail
          /tmp/phase3c-diagnostic-venv/bin/python scripts/diagnose_phase3c_failure.py run \
            --manifest ../manifest-source/manifest.json \
            --expected-manifest-sha256 7e4df48a0d73fcdad7de9dc0c8e8a15e64f041388a5c6044dd9fa79b938ebc9b \
            --attempt-id task12-20260916-a \
            --approve-measurement

      - name: Verify completed registered diagnostic
        working-directory: runtime
        shell: bash
        run: |
          set -euo pipefail
          /tmp/phase3c-diagnostic-venv/bin/python scripts/diagnose_phase3c_failure.py verify \
            --manifest ../manifest-source/manifest.json \
            --attempt-dir ../manifest-source/attempt-task12-20260916-a

      - name: Render verified diagnostic report
        working-directory: runtime
        shell: bash
        run: |
          set -euo pipefail
          /tmp/phase3c-diagnostic-venv/bin/python scripts/diagnose_phase3c_failure.py report \
            --manifest ../manifest-source/manifest.json \
            --attempt-dir ../manifest-source/attempt-task12-20260916-a \
            --output ../manifest-source/report-task12-20260916-a

      - name: Upload manifest, evidence, and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3c-diagnostics-task12-20260916-a-env-audit
          path: |
            manifest-source/manifest.json
            manifest-source/manifest.sha256
            manifest-source/attempt-task12-20260916-a/
            manifest-source/report-task12-20260916-a/
          if-no-files-found: warn
          retention-days: 30
