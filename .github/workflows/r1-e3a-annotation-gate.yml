name: R1-E3A annotation gate

on:
  push:
    branches:
      - research/r1-e3a-annotation-freeze
    paths:
      - docs/r1-e3/annotation-sampling-protocol.md
      - tools/r1_e3a_semantic_freeze.py
      - tools/r1_e3a_review_pack.py
      - tests/test_r1_e3a_semantic_freeze.py
      - tests/test_r1_e3a_review_pack.py
      - .github/workflows/r1-e3a-annotation-gate.yml
  pull_request:
    paths:
      - docs/r1-e3/annotation-sampling-protocol.md
      - tools/r1_e3a_semantic_freeze.py
      - tools/r1_e3a_review_pack.py
      - tests/test_r1_e3a_semantic_freeze.py
      - tests/test_r1_e3a_review_pack.py
      - .github/workflows/r1-e3a-annotation-gate.yml

permissions:
  contents: read

concurrency:
  group: r1-e3a-annotation-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  annotation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test tools
        run: python -m pip install --disable-pip-version-check pytest ruff
      - name: Focused annotation tests
        run: >-
          pytest -q
          tests/test_r1_e3a_semantic_freeze.py
          tests/test_r1_e3a_review_pack.py
      - name: Focused annotation Ruff
        run: >-
          ruff check
          tools/r1_e3a_semantic_freeze.py
          tools/r1_e3a_review_pack.py
          tests/test_r1_e3a_semantic_freeze.py
          tests/test_r1_e3a_review_pack.py
